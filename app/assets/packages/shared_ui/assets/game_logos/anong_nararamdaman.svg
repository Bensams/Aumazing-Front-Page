<!--
  Ano'ng Nararamdaman? — one face showing a feeling, and two smaller face cards
  below it to choose from. The tile has to read as *matching a feeling*, not as
  a generic smiley: hence the big face up top with the question mark beside it,
  and the pair of cards underneath, one of which is clearly the same face.

  The big face is deliberately NOT happy. A smiling tile would advertise the
  answer to a third of the game's trials and would suggest the game is about
  being cheerful; it is about noticing. It is drawn surprised — open mouth,
  raised brows — which is unmistakable at tile size and belongs to no other
  logo in the set.

  No <text>: the question mark is a path, because an unbundled font would
  silently render as nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B5AE"/>
      <stop offset="1" stop-color="#A9BEE8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <!-- Same decorative specks as the other tiles -->
    <g fill="#FFFFFF" opacity="0.16">
      <circle cx="30" cy="44" r="11"/>
      <circle cx="210" cy="52" r="7"/>
      <circle cx="204" cy="192" r="9"/>
      <circle cx="36" cy="196" r="6"/>
    </g>

    <!-- The friend's face: surprised -->
    <g transform="translate(104 84)">
      <circle cx="0" cy="0" r="52" fill="#FFD9BE" stroke="#3F3B4A" stroke-width="6"/>
      <!-- Hair cap, so it reads as a child rather than a smiley -->
      <path d="M-50 -8 q8 -50 50 -50 q42 0 50 50 q-22 -24 -50 -24 q-28 0 -50 24 z"
            fill="#4A3F55" stroke="#3F3B4A" stroke-width="4"/>
      <!-- Cheeks -->
      <circle cx="-32" cy="14" r="10" fill="#F2A8B0" opacity="0.55"/>
      <circle cx="32" cy="14" r="10" fill="#F2A8B0" opacity="0.55"/>
      <!-- Wide eyes -->
      <ellipse cx="-19" cy="-2" rx="8" ry="11" fill="#FFFDF8" stroke="#3F3B4A" stroke-width="4"/>
      <ellipse cx="19" cy="-2" rx="8" ry="11" fill="#FFFDF8" stroke="#3F3B4A" stroke-width="4"/>
      <circle cx="-19" cy="-1" r="4" fill="#3F3B4A"/>
      <circle cx="19" cy="-1" r="4" fill="#3F3B4A"/>
      <!-- Brows, lifted -->
      <g stroke="#3F3B4A" stroke-width="5.5" stroke-linecap="round" fill="none">
        <path d="M-31 -22 q6 -7 16 -5"/>
        <path d="M31 -22 q-6 -7 -16 -5"/>
      </g>
      <!-- Open mouth -->
      <ellipse cx="0" cy="26" rx="12" ry="15" fill="#7A4550" stroke="#3F3B4A" stroke-width="4.5"/>
    </g>

    <!-- Question mark beside the face -->
    <g transform="translate(196 62)" fill="#FFFFFF" opacity="0.95">
      <path d="M-11 -14 q0 -15 12 -15 q12 0 12 12 q0 10 -10 13 q-4 1 -4 7 l0 3 l-9 0 l0 -5
               q0 -9 8 -12 q6 -2 6 -7 q0 -5 -5 -5 q-5 0 -5 9 z"/>
      <circle cx="-2" cy="16" r="6"/>
    </g>

    <!-- Two answer cards below; the left one is the matching face -->
    <g transform="translate(52 162)">
      <rect width="60" height="58" rx="14" fill="#FFFDF8" stroke="#3F3B4A" stroke-width="5"/>
      <ellipse cx="21" cy="24" rx="5" ry="7" fill="#3F3B4A"/>
      <ellipse cx="39" cy="24" rx="5" ry="7" fill="#3F3B4A"/>
      <ellipse cx="30" cy="42" rx="7" ry="9" fill="#7A4550" stroke="#3F3B4A" stroke-width="3"/>
    </g>
    <g transform="translate(128 162)">
      <rect width="60" height="58" rx="14" fill="#FFFDF8" stroke="#3F3B4A" stroke-width="5"
            opacity="0.9"/>
      <circle cx="21" cy="24" r="4" fill="#3F3B4A"/>
      <circle cx="39" cy="24" r="4" fill="#3F3B4A"/>
      <path d="M19 46 q11 -10 22 0" stroke="#3F3B4A" stroke-width="4.5" fill="none"
            stroke-linecap="round"/>
    </g>
  </g>
</svg>
