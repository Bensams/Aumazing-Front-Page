<!--
  My Turn, Your Turn — two friends and the block that passes between them.
  Two skin tones on purpose; the buddy is another child, not a device.

  The exchange arc sits *above* the heads. Below them, two round faces with a
  curve underneath read as one enormous smiling face rather than as two
  children taking turns.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FC2E8"/>
      <stop offset="1" stop-color="#B6C6F0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <g fill="#FFFFFF" opacity="0.14">
      <ellipse cx="28" cy="36" rx="10" ry="23" transform="rotate(-28 28 36)"/>
      <ellipse cx="214" cy="72" rx="9" ry="20" transform="rotate(34 214 72)"/>
      <ellipse cx="38" cy="210" rx="9" ry="20" transform="rotate(22 38 210)"/>
    </g>

    <!-- The hand-off: an arc that points at both children, arrowheads cut
         along the curve's tangent so they read as direction, not as flags. -->
    <g fill="#FFFFFF">
      <path d="M76,104 Q120,52 164,104" fill="none" stroke="#FFFFFF"
            stroke-width="7" stroke-linecap="round"/>
      <path d="M76,104 L94.5,96.1 L80.7,84.5 Z"/>
      <path d="M164,104 L145.5,96.1 L159.3,84.5 Z"/>
    </g>

    <!-- The shared block, riding the arc between them -->
    <rect x="105" y="49" width="30" height="30" rx="8" fill="#F5B942"
          stroke="#FFFFFF" stroke-width="5"/>

    <!-- Two faces, side by side -->
    <g stroke="#FFFFFF" stroke-width="6">
      <circle cx="72" cy="148" r="36" fill="#FFF1DC"/>
      <circle cx="168" cy="148" r="36" fill="#D8AE86"/>
    </g>
    <g fill="#5A5A6B">
      <circle cx="61" cy="140" r="4.5"/>
      <circle cx="83" cy="140" r="4.5"/>
      <circle cx="157" cy="140" r="4.5"/>
      <circle cx="179" cy="140" r="4.5"/>
    </g>
    <g fill="none" stroke="#5A5A6B" stroke-width="5" stroke-linecap="round">
      <path d="M59,158 Q72,169 85,158"/>
      <path d="M155,158 Q168,169 181,158"/>
    </g>
  </g>
</svg>
