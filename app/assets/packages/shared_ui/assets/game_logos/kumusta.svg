<!--
  Kumusta! — two hands meeting: one waving hello, one waving back. The tile has
  to read as an *exchange*, not a single greeting, because the skill is the
  return. No <text>: an unbundled font would silently render as nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6B26B"/>
      <stop offset="1" stop-color="#7EC8E3"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <!-- Decorative specks, same language as the other tiles -->
    <g fill="#FFFFFF" opacity="0.16">
      <circle cx="36" cy="48" r="7"/>
      <circle cx="204" cy="52" r="5"/>
      <circle cx="198" cy="198" r="8"/>
      <circle cx="42" cy="190" r="5"/>
    </g>

    <!-- Motion arcs between the hands: the greeting travelling across. -->
    <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M104,66 q16,-16 32,0"/>
      <path d="M96,50 q24,-24 48,0"/>
    </g>

    <!-- Left hand: waving hello, tilted mid-swing. -->
    <g transform="translate(76 150) rotate(-16)">
      <rect x="-26" y="-6" width="52" height="46" rx="18" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-21" y="-42" width="12" height="38" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="-7" y="-50" width="12" height="46" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="7" y="-46" width="12" height="42" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="-38" y="-2" width="12" height="28" rx="6" transform="rotate(-32 -32 12)"
            fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3.5"/>
    </g>

    <!-- Right hand: the answer, mirrored so the two clearly face each other. -->
    <g transform="translate(164 150) rotate(16) scale(-1 1)">
      <rect x="-26" y="-6" width="52" height="46" rx="18" fill="#E9CBA6" stroke="#FFFFFF" stroke-width="4"/>
      <rect x="-21" y="-42" width="12" height="38" rx="6" fill="#E9CBA6" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="-7" y="-50" width="12" height="46" rx="6" fill="#E9CBA6" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="7" y="-46" width="12" height="42" rx="6" fill="#E9CBA6" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="-38" y="-2" width="12" height="28" rx="6" transform="rotate(-32 -32 12)"
            fill="#E9CBA6" stroke="#FFFFFF" stroke-width="3.5"/>
    </g>
  </g>
</svg>
