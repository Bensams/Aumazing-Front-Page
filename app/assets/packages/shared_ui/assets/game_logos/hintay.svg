<!--
  Hintay! — the sleeping star with its "zzz", and a hand held back rather than
  reaching. The tile has to read as *wait*, not *tap*: a pointing finger would
  advertise the opposite of the skill. No <text>: the zzz are drawn as paths,
  because an unbundled font would silently render as nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A8DE"/>
      <stop offset="1" stop-color="#8FC4E6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#FFF4C4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <!-- Drifting night specks, same decorative language as the other tiles -->
    <g fill="#FFFFFF" opacity="0.16">
      <circle cx="34" cy="52" r="7"/>
      <circle cx="206" cy="44" r="5"/>
      <circle cx="196" cy="200" r="8"/>
      <circle cx="44" cy="192" r="5"/>
    </g>

    <circle cx="112" cy="118" r="76" fill="url(#halo)"/>

    <!-- The star, asleep: lids closed, no smile. Neutral on purpose — the
         child should not have to read emotion to know what to do. -->
    <g transform="translate(112 118)">
      <path d="M0,-62 L17.6,-19.2 L63,-15.9 L28.2,13.4 L39.9,58 L0,33.5 L-39.9,58 L-28.2,13.4 L-63,-15.9 L-17.6,-19.2 Z"
            fill="#F3E6A8" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <g fill="none" stroke="#5A5A6B" stroke-width="5" stroke-linecap="round">
        <path d="M-22,-2 q7,7 14,0"/>
        <path d="M8,-2 q7,7 14,0"/>
      </g>
    </g>

    <!-- zzz, rising from the star -->
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <path d="M158,74 L182,74 L158,96 L182,96"/>
      <path d="M190,44 L208,44 L190,61 L208,61" stroke-width="5.5"/>
    </g>

    <!-- A hand held flat and low — the "wait" gesture, deliberately not a
         pointing finger. -->
    <g transform="translate(78 196)" opacity="0.95">
      <rect x="-30" y="-14" width="60" height="21" rx="10" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3.5"/>
      <rect x="-22" y="-25" width="12" height="16" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-6" y="-29" width="12" height="20" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="10" y="-25" width="12" height="16" rx="6" fill="#F2DFC0" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
</svg>
