<!-- Copy Me — a four-pad grid with one pad lit and ringed, mid-sequence. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBD98F"/>
      <stop offset="1" stop-color="#F7B7A3"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <g fill="#FFFFFF" opacity="0.14">
      <ellipse cx="28" cy="36" rx="10" ry="23" transform="rotate(-28 28 36)"/>
      <ellipse cx="214" cy="72" rx="9" ry="20" transform="rotate(34 214 72)"/>
      <ellipse cx="38" cy="210" rx="9" ry="20" transform="rotate(22 38 210)"/>
    </g>

    <!-- The lit pad's halo sits under the grid so it reads as glow, not outline -->
    <circle cx="163" cy="77" r="56" fill="#FFFFFF" opacity="0.30"/>
    <circle cx="163" cy="77" r="56" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.55"/>

    <!-- Quiet pads -->
    <g fill="#FFFFFF" opacity="0.85">
      <rect x="40" y="40" width="74" height="74" rx="18"/>
      <rect x="40" y="126" width="74" height="74" rx="18"/>
      <rect x="126" y="126" width="74" height="74" rx="18"/>
    </g>
    <circle cx="77" cy="77" r="18" fill="#7FC8A9"/>
    <path d="M77,145 L96,181 L58,181 Z" fill="#8FC2E8"/>
    <path d="M163,163 L169,177 L184,178 L172,188 L176,203 L163,195 L150,203 L154,188 L142,178 L157,177 Z"
          fill="#C3A8EA"/>

    <!-- The pad the child has to copy -->
    <rect x="126" y="40" width="74" height="74" rx="18" fill="#FFFFFF"/>
    <rect x="145" y="59" width="36" height="36" rx="9" fill="#F5B942"/>

    <!-- Sparkles on the lit pad -->
    <g fill="#FFFFFF">
      <path d="M212,30 L216,42 L228,46 L216,50 L212,62 L208,50 L196,46 L208,42 Z"/>
      <path d="M116,26 L119,34 L127,37 L119,40 L116,48 L113,40 L105,37 L113,34 Z" opacity="0.8"/>
    </g>
  </g>
</svg>
