<!--
  Sari-Sari Store Sorting — the striped, scalloped awning every Filipino
  sari-sari store has, and two baskets waiting for the items above them.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C879"/>
      <stop offset="1" stop-color="#A3D3A8"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <g fill="#FFFFFF" opacity="0.14">
      <ellipse cx="28" cy="36" rx="10" ry="23" transform="rotate(-28 28 36)"/>
      <ellipse cx="38" cy="210" rx="9" ry="20" transform="rotate(22 38 210)"/>
    </g>

    <!-- Awning: alternating panels, then a scalloped hem in matching colours -->
    <g>
      <rect x="12" y="22" width="44" height="36" fill="#E8908A"/>
      <rect x="56" y="22" width="44" height="36" fill="#FFFFFF"/>
      <rect x="100" y="22" width="44" height="36" fill="#E8908A"/>
      <rect x="144" y="22" width="44" height="36" fill="#FFFFFF"/>
      <rect x="188" y="22" width="44" height="36" fill="#E8908A"/>
      <circle cx="34" cy="58" r="22" fill="#E8908A"/>
      <circle cx="78" cy="58" r="22" fill="#FFFFFF"/>
      <circle cx="122" cy="58" r="22" fill="#E8908A"/>
      <circle cx="166" cy="58" r="22" fill="#FFFFFF"/>
      <circle cx="210" cy="58" r="22" fill="#E8908A"/>
    </g>

    <!-- Items on their way down -->
    <g stroke="#FFFFFF" stroke-width="4">
      <circle cx="74" cy="118" r="19" fill="#E8908A"/>
      <rect x="156" y="96" width="36" height="42" rx="9" fill="#8FC9A8"/>
    </g>
    <path d="M74,99 Q84,90 92,96" fill="none" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round"/>

    <!-- Two baskets to sort into -->
    <g stroke="#FFFFFF" stroke-width="5">
      <path d="M42,158 L114,158 L104,208 L52,208 Z" fill="#D8A468"/>
      <path d="M130,158 L202,158 L192,208 L140,208 Z" fill="#D8A468"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="36" y="148" width="84" height="16" rx="8"/>
      <rect x="124" y="148" width="84" height="16" rx="8"/>
    </g>
  </g>
</svg>
