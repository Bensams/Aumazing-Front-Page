<!--
  Do What I Say — a spoken shape in a bubble, and the tile it belongs to
  ringed below. The instruction and its answer are both on the tile, so the
  logo shows the whole loop: hear it, then tap it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="tile"><rect width="240" height="240" rx="48"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A3E3"/>
      <stop offset="1" stop-color="#CFC4F0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="240" height="240" rx="48" fill="url(#bg)"/>

    <g fill="#FFFFFF" opacity="0.14">
      <ellipse cx="28" cy="36" rx="10" ry="23" transform="rotate(-28 28 36)"/>
      <ellipse cx="214" cy="72" rx="9" ry="20" transform="rotate(34 214 72)"/>
      <ellipse cx="38" cy="210" rx="9" ry="20" transform="rotate(22 38 210)"/>
    </g>

    <!-- Voice -->
    <g fill="#FFFFFF">
      <path d="M60,100 L96,100 L66,130 Z"/>
      <rect x="24" y="26" width="146" height="78" rx="22"/>
    </g>
    <path d="M97,44 L122,84 L72,84 Z" fill="#B9A3E3"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <path d="M186,48 Q198,65 186,82"/>
      <path d="M204,36 Q222,65 204,94"/>
    </g>

    <!-- Two choices; the ringed one matches what was said -->
    <rect x="26" y="146" width="68" height="68" rx="16" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="60" cy="180" r="18" fill="#8FC2E8"/>

    <circle cx="180" cy="180" r="54" fill="#FFFFFF" opacity="0.26"/>
    <rect x="146" y="146" width="68" height="68" rx="16" fill="#FFFFFF"/>
    <path d="M180,161 L199,197 L161,197 Z" fill="#B9A3E3"/>
    <!-- Ring drawn last and wide enough to clear the tile's corners, so it
         reads as a tap ripple instead of a line across the tile. -->
    <circle cx="180" cy="180" r="54" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.65"/>
  </g>
</svg>
